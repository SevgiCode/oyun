<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Kahramanı — Etiket Eşleştirme</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(135deg, #eef4ff, #fff1f7);
        color: #222;
      }

      header {
        text-align: center;
        padding: 24px 16px;
        background: linear-gradient(135deg, #4f46e5, #9333ea);
        color: white;
      }

      header h1 {
        margin: 0;
        font-size: clamp(24px, 4vw, 34px);
      }
      header p {
        margin: 8px 0 0;
        opacity: 0.92;
      }

      .game {
        max-width: 1150px;
        margin: 24px auto;
        padding: 0 16px;
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: 20px;
      }

      .panel {
        background: white;
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.09);
      }

      .topbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
        font-weight: bold;
      }

      .chip {
        background: #eef2ff;
        color: #3730a3;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 14px;
      }

      .progress {
        height: 14px;
        background: #e5e7eb;
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 18px;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #22c55e, #84cc16);
        transition: width 0.35s ease;
      }

      h2 {
        margin-top: 0;
        font-size: 20px;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        min-height: 150px;
        padding: 6px;
      }

      .tag {
        border: 3px solid transparent;
        border-radius: 14px;
        padding: 12px 16px;
        font-family: ui-monospace, monospace;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        user-select: none;
        transition:
          transform 0.15s,
          box-shadow 0.15s,
          background 0.2s;
      }

      .tag:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
      }

      .opening {
        background: #dbeafe;
        color: #1d4ed8;
      }
      .closing {
        background: #ffe4e6;
        color: #be123c;
      }

      .selected {
        outline: 4px solid #4f46e5;
      }

      .correct {
        background: #dcfce7 !important;
        color: #15803d !important;
        border-color: #22c55e;
        cursor: default;
        animation: pop 0.35s;
      }

      .wrong {
        animation: shake 0.35s;
        border-color: #ef4444;
      }

      @keyframes pop {
        0% {
          transform: scale(0.85);
        }
        60% {
          transform: scale(1.08);
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-6px);
        }
        75% {
          transform: translateX(6px);
        }
      }

      .message {
        min-height: 28px;
        margin: 14px 0;
        font-weight: bold;
      }

      .buttons {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      button {
        border: 0;
        background: #4f46e5;
        color: white;
        font-size: 15px;
        font-weight: bold;
        padding: 12px 16px;
        border-radius: 12px;
        cursor: pointer;
      }

      button.secondary {
        background: #f59e0b;
      }

      button:hover {
        filter: brightness(0.94);
      }

      .preview {
        border: 2px dashed #c7d2fe;
        border-radius: 16px;
        padding: 18px;
        min-height: 320px;
        background: #fafafa;
      }

      .preview h1 {
        color: #4f46e5;
      }
      .preview p {
        line-height: 1.55;
      }

      .preview .box {
        background: #fef08a;
        border-radius: 14px;
        padding: 16px;
        text-align: center;
        font-weight: bold;
      }

      .preview ul {
        background: white;
        border-radius: 12px;
        padding: 16px 16px 16px 34px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
      }

      .preview a {
        display: inline-block;
        background: #4f46e5;
        color: white;
        text-decoration: none;
        padding: 10px 16px;
        border-radius: 999px;
        font-weight: bold;
      }

      .fact {
        margin-top: 16px;
        background: #fff7ed;
        border-left: 6px solid #f97316;
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 15px;
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.72);
        display: none;
        place-items: center;
        padding: 20px;
        z-index: 20;
      }

      .overlay.show {
        display: grid;
      }

      .card {
        background: white;
        border-radius: 22px;
        padding: 30px;
        max-width: 480px;
        text-align: center;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
      }

      .card h2 {
        margin: 0 0 10px;
        font-size: 28px;
      }
      .stars {
        font-size: 38px;
        margin: 10px 0;
      }
      .badge {
        display: inline-block;
        background: #fef3c7;
        border: 2px solid #f59e0b;
        padding: 8px 14px;
        border-radius: 999px;
        font-weight: bold;
        margin: 6px;
      }

      @media (max-width: 850px) {
        .game {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🦸 HTML Kahramanı</h1>
      <p>Etiketleri eşleştir, sayfayı inşa et, HTML kahramanı ol!</p>
    </header>

    <main class="game">
      <section class="panel">
        <div class="topbar">
          <span class="chip">🗺️ Seviye <span id="levelNo">1</span>/5</span>
          <span class="chip">⭐ <span id="score">0</span> puan</span>
          <span class="chip">🏅 <span id="badgeCount">0</span> rozet</span>
        </div>

        <div class="progress">
          <div class="progress-fill" id="progressFill"></div>
        </div>

        <h2>🧩 Etiketleri Eşleştir</h2>
        <div class="tags" id="tags"></div>

        <div class="message" id="message"></div>

        <div class="buttons">
          <button id="hintBtn">💡 İpucu</button>
          <button class="secondary" id="restartBtn">🔄 Baştan Başla</button>
        </div>
      </section>

      <section class="panel">
        <h2>👀 Canlı Sayfa Önizlemesi</h2>
        <div class="preview" id="preview"></div>
        <div class="fact" id="fact"></div>
      </section>
    </main>

    <div class="overlay" id="overlay">
      <div class="card">
        <h2 id="overlayTitle">🎉 Seviye Tamam!</h2>
        <div class="stars" id="overlayStars">⭐⭐⭐</div>
        <p id="overlayText"></p>
        <div id="overlayBadge"></div>
        <br />
        <button id="nextBtn">Devam Et ➡️</button>
      </div>
    </div>

    <script>
      const levels = [
        {
          title: "Başlık ve Paragraf",
          fact: "💡 <h1> sayfanın en önemli başlığıdır. <p> ise normal bir yazı paragrafı oluşturur.",
          pairs: [
            {
              open: "<h1>",
              close: "</h1>",
              type: "h1",
              text: "Merhaba Dünya!",
            },
            {
              open: "<p>",
              close: "</p>",
              type: "p",
              text: "Ben HTML öğreniyorum.",
            },
          ],
        },
        {
          title: "Kutular: Div",
          fact: "💡 <div> içeriği gruplamak için kullanılan bir kutudur. Sayfa düzeninde çok işe yarar.",
          pairs: [
            { open: "<h1>", close: "</h1>", type: "h1", text: "Benim Sayfam" },
            {
              open: "<p>",
              close: "</p>",
              type: "p",
              text: "Bugün harika bir gün!",
            },
            {
              open: "<div>",
              close: "</div>",
              type: "div",
              text: "Ben bir kutuyum 📦",
            },
          ],
        },
        {
          title: "Liste Yapalım",
          fact: "💡 <ul> listeyi başlatır, <li> ise listedeki her öğeyi temsil eder.",
          pairs: [
            {
              open: "<h1>",
              close: "</h1>",
              type: "h1",
              text: "Sevdiğim Meyveler",
            },
            { open: "<ul>", close: "</ul>", type: "ul", text: "" },
            { open: "<li>", close: "</li>", type: "li", text: "Elma 🍎" },
            { open: "<li>", close: "</li>", type: "li", text: "Muz 🍌" },
          ],
        },
        {
          title: "Bağlantı Ekle",
          fact: "💡 <a> etiketi başka bir sayfaya veya siteye giden bağlantı oluşturur.",
          pairs: [
            { open: "<h1>", close: "</h1>", type: "h1", text: "Benim Sitem" },
            {
              open: "<p>",
              close: "</p>",
              type: "p",
              text: "Aşağıdaki düğmeye tıkla!",
            },
            { open: "<a>", close: "</a>", type: "a", text: "Beni Tıkla" },
          ],
        },
        {
          title: "Küçük Bir Sayfa",
          fact: "💡 Gerçek sayfalar genellikle başlık, paragraf, kutu, liste ve bağlantı gibi parçalardan oluşur.",
          pairs: [
            {
              open: "<h1>",
              close: "</h1>",
              type: "h1",
              text: "HTML Kahramanı",
            },
            {
              open: "<p>",
              close: "</p>",
              type: "p",
              text: "Bugün ilk sayfamı yaptım!",
            },
            {
              open: "<div>",
              close: "</div>",
              type: "div",
              text: "Başardım! 🎉",
            },
            { open: "<a>", close: "</a>", type: "a", text: "Devam Et" },
          ],
        },
      ];

      let levelIndex = 0;
      let score = 0;
      let totalScore = 0;
      let badges = 0;
      let completed = 0;
      let selectedTag = null;
      let hintsUsed = 0;

      const tagsArea = document.getElementById("tags");
      const preview = document.getElementById("preview");
      const message = document.getElementById("message");
      const scoreEl = document.getElementById("score");
      const badgeCount = document.getElementById("badgeCount");
      const levelNo = document.getElementById("levelNo");
      const progressFill = document.getElementById("progressFill");
      const factBox = document.getElementById("fact");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayStars = document.getElementById("overlayStars");
      const overlayText = document.getElementById("overlayText");
      const overlayBadge = document.getElementById("overlayBadge");
      const nextBtn = document.getElementById("nextBtn");

      function playTone(frequency, duration = 0.18, type = "sine") {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = type;
          osc.frequency.value = frequency;
          osc.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            0.001,
            ctx.currentTime + duration,
          );

          osc.start();
          osc.stop(ctx.currentTime + duration);
        } catch (e) {}
      }

      function playCorrect() {
        playTone(660, 0.15);
        setTimeout(() => playTone(880, 0.18), 130);
      }
      function playWrong() {
        playTone(180, 0.25, "triangle");
      }
      function playLevelUp() {
        [523, 659, 784, 1046].forEach((f, i) =>
          setTimeout(() => playTone(f, 0.18), i * 120),
        );
      }

      function shuffle(items) {
        return [...items].sort(() => Math.random() - 0.5);
      }

      function startGame() {
        levelIndex = 0;
        totalScore = 0;
        badges = 0;
        scoreEl.textContent = 0;
        badgeCount.textContent = 0;
        overlay.classList.remove("show");
        loadLevel();
      }

      function loadLevel() {
        const level = levels[levelIndex];
        completed = 0;
        score = 0;
        hintsUsed = 0;
        selectedTag = null;

        tagsArea.innerHTML = "";
        preview.innerHTML = "";
        message.textContent = "";
        factBox.innerHTML = level.fact;
        levelNo.textContent = levelIndex + 1;
        progressFill.style.width = "0%";

        const items = [];

        level.pairs.forEach((pair, index) => {
          items.push({ ...pair, kind: "open", pairId: index });
          items.push({ ...pair, kind: "close", pairId: index });
        });

        shuffle(items).forEach((item) => {
          const el = document.createElement("div");
          el.className =
            "tag " + (item.kind === "open" ? "opening" : "closing");
          el.textContent = item.kind === "open" ? item.open : item.close;
          el.dataset.pairId = item.pairId;
          el.dataset.kind = item.kind;
          el.draggable = true;

          el.addEventListener("dragstart", () => {
            if (!el.classList.contains("correct")) {
              selectTag(el);
            }
          });

          el.addEventListener("dragover", (e) => e.preventDefault());

          el.addEventListener("drop", (e) => {
            e.preventDefault();
            tryMatch(el);
          });

          el.addEventListener("click", () => {
            if (el.classList.contains("correct")) return;

            if (!selectedTag) {
              selectTag(el);
            } else {
              tryMatch(el);
            }
          });

          tagsArea.appendChild(el);
        });
      }

      function selectTag(el) {
        clearSelection();
        selectedTag = el;
        el.classList.add("selected");
      }

      function clearSelection() {
        document
          .querySelectorAll(".tag.selected")
          .forEach((el) => el.classList.remove("selected"));
        selectedTag = null;
      }

      function tryMatch(target) {
        if (!selectedTag || selectedTag === target) return;

        const samePair = selectedTag.dataset.pairId === target.dataset.pairId;
        const oppositeKind = selectedTag.dataset.kind !== target.dataset.kind;

        if (samePair && oppositeKind) {
          selectedTag.classList.remove("selected");
          selectedTag.classList.add("correct");
          target.classList.add("correct");

          selectedTag.draggable = false;
          target.draggable = false;

          score += hintsUsed > 0 ? 5 : 10;
          totalScore += hintsUsed > 0 ? 5 : 10;
          completed++;
          hintsUsed = 0;

          scoreEl.textContent = totalScore;
          message.textContent = "✅ Süper! Doğru etiket çifti.";
          message.style.color = "#15803d";
          playCorrect();

          addToPreview(Number(target.dataset.pairId));
          updateProgress();

          selectedTag = null;

          if (completed === levels[levelIndex].pairs.length) {
            setTimeout(showLevelComplete, 700);
          }
        } else {
          target.classList.add("wrong");
          message.textContent = "🤔 Bunlar eşleşmiyor. Tekrar dene!";
          message.style.color = "#be123c";
          playWrong();

          setTimeout(() => target.classList.remove("wrong"), 400);
          clearSelection();
        }
      }

      function addToPreview(pairId) {
        const pair = levels[levelIndex].pairs[pairId];
        let el;

        if (pair.type === "h1") {
          el = document.createElement("h1");
        } else if (pair.type === "p") {
          el = document.createElement("p");
        } else if (pair.type === "div") {
          el = document.createElement("div");
          el.className = "box";
        } else if (pair.type === "ul") {
          el = document.createElement("ul");
        } else if (pair.type === "li") {
          el = document.createElement("li");
        } else if (pair.type === "a") {
          el = document.createElement("a");
          el.href = "#";
          el.addEventListener("click", (e) => e.preventDefault());
        }

        el.textContent = pair.text;
        preview.appendChild(el);
      }

      function updateProgress() {
        const total = levels[levelIndex].pairs.length;
        progressFill.style.width = (completed / total) * 100 + "%";
      }

      function giveHint() {
        const openTags = [
          ...document.querySelectorAll(".tag.opening:not(.correct)"),
        ];
        const closeTags = [
          ...document.querySelectorAll(".tag.closing:not(.correct)"),
        ];

        if (!openTags.length || !closeTags.length) return;

        const openTag = openTags[0];
        const closeTag = closeTags.find(
          (tag) => tag.dataset.pairId === openTag.dataset.pairId,
        );

        if (!closeTag) return;

        openTag.classList.add("correct");
        closeTag.classList.add("correct");

        openTag.draggable = false;
        closeTag.draggable = false;

        score += 5;
        totalScore += 5;
        completed++;
        hintsUsed++;

        scoreEl.textContent = totalScore;
        message.textContent =
          "💡 İpucu kullanıldı. Bu çifti birlikte inceledin!";
        message.style.color = "#b45309";

        addToPreview(Number(openTag.dataset.pairId));
        updateProgress();
        playCorrect();

        if (completed === levels[levelIndex].pairs.length) {
          setTimeout(showLevelComplete, 700);
        }
      }

      function showLevelComplete() {
        const level = levels[levelIndex];
        const stars =
          score >= level.pairs.length * 10
            ? 3
            : score >= level.pairs.length * 7
              ? 2
              : 1;

        overlayTitle.textContent = "🎉 Seviye Tamam!";
        overlayStars.textContent = "⭐".repeat(stars) + "☆".repeat(3 - stars);
        overlayText.textContent = `"${level.title}" bölümünü bitirdin!`;

        if (stars === 3) {
          badges++;
          badgeCount.textContent = badges;
          overlayBadge.innerHTML = `<span class="badge">🏅 ${level.title} Uzmanı</span>`;
        } else {
          overlayBadge.innerHTML = "";
        }

        overlay.classList.add("show");
        playLevelUp();

        nextBtn.textContent =
          levelIndex + 1 < levels.length ? "Devam Et ➡️" : "Oyunu Bitir 🏆";
      }

      function nextLevel() {
        overlay.classList.remove("show");

        if (levelIndex + 1 < levels.length) {
          levelIndex++;
          loadLevel();
        } else {
          overlayTitle.textContent = "🏆 Tebrikler!";
          overlayStars.textContent = "🌟🌟🌟";
          overlayText.innerHTML = `Tüm seviyeleri tamamladın!<br><br>Toplam puan: <b>${totalScore}</b><br>Rozet: <b>${badges}</b>`;
          overlayBadge.innerHTML = `<span class="badge">🦸 HTML Kahramanı</span>`;
          nextBtn.textContent = "Tekrar Oyna 🔄";
          levelIndex = -1;
        }
      }

      document.getElementById("hintBtn").addEventListener("click", giveHint);
      document
        .getElementById("restartBtn")
        .addEventListener("click", startGame);
      nextBtn.addEventListener("click", nextLevel);

      startGame();
    </script>
  </body>
</html>
