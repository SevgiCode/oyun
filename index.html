<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Kahramanı 2 — Etiket Okulu</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(135deg, #eef4ff, #fff7ed);
        color: #1f2937;
      }

      header {
        text-align: center;
        padding: 26px 16px;
        background: linear-gradient(135deg, #4f46e5, #9333ea, #ec4899);
        color: white;
      }

      header h1 {
        margin: 0;
        font-size: clamp(26px, 5vw, 38px);
      }

      header p {
        margin: 8px 0 0;
        opacity: 0.92;
      }

      .container {
        max-width: 1150px;
        margin: 24px auto;
        padding: 0 16px;
      }

      .menu {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
        margin-bottom: 20px;
      }

      .mode-btn {
        background: white;
        border: 3px solid #e5e7eb;
        border-radius: 18px;
        padding: 18px;
        text-align: left;
        cursor: pointer;
        transition:
          transform 0.15s,
          border-color 0.15s;
      }

      .mode-btn:hover {
        transform: translateY(-4px);
        border-color: #4f46e5;
      }

      .mode-btn.active {
        border-color: #4f46e5;
        background: #eef2ff;
      }

      .mode-btn strong {
        display: block;
        font-size: 18px;
        margin-bottom: 6px;
      }

      .difficulty {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        margin-bottom: 20px;
      }

      .diff-btn {
        border: 0;
        background: #e5e7eb;
        color: #374151;
        padding: 10px 18px;
        border-radius: 999px;
        font-weight: bold;
        cursor: pointer;
      }

      .diff-btn.active {
        background: #4f46e5;
        color: white;
      }

      .panel {
        background: white;
        border-radius: 22px;
        padding: 22px;
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.09);
        margin-bottom: 20px;
      }

      .topbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        font-weight: bold;
      }

      .chip {
        background: #eef2ff;
        color: #3730a3;
        padding: 8px 13px;
        border-radius: 999px;
        font-size: 14px;
      }

      .progress {
        height: 14px;
        background: #e5e7eb;
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 18px;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #22c55e, #84cc16);
        transition: width 0.3s;
      }

      h2 {
        margin-top: 0;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        min-height: 140px;
      }

      .tag {
        border: 3px solid transparent;
        border-radius: 16px;
        padding: 12px 16px;
        font-family: ui-monospace, monospace;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        user-select: none;
        text-align: center;
        transition:
          transform 0.15s,
          box-shadow 0.15s;
      }

      .tag small {
        display: block;
        font-family: "Segoe UI", sans-serif;
        font-size: 12px;
        font-weight: normal;
        margin-top: 4px;
        opacity: 0.8;
      }

      .tag:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
      }

      .opening {
        background: #dbeafe;
        color: #1d4ed8;
      }
      .closing {
        background: #ffe4e6;
        color: #be123c;
      }
      .single {
        background: #fef3c7;
        color: #92400e;
      }
      .answer {
        background: #f3f4f6;
        color: #374151;
      }

      .selected {
        outline: 4px solid #4f46e5;
      }

      .correct {
        background: #dcfce7 !important;
        color: #15803d !important;
        border-color: #22c55e;
        cursor: default;
        animation: pop 0.35s;
      }

      .wrong {
        animation: shake 0.35s;
        border-color: #ef4444;
      }

      @keyframes pop {
        0% {
          transform: scale(0.85);
        }
        60% {
          transform: scale(1.08);
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-6px);
        }
        75% {
          transform: translateX(6px);
        }
      }

      .message {
        min-height: 30px;
        margin: 16px 0;
        font-weight: bold;
      }

      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      button {
        border: 0;
        background: #4f46e5;
        color: white;
        font-size: 15px;
        font-weight: bold;
        padding: 12px 16px;
        border-radius: 12px;
        cursor: pointer;
      }

      button.secondary {
        background: #f59e0b;
      }
      button:hover {
        filter: brightness(0.94);
      }

      .preview {
        border: 2px dashed #c7d2fe;
        border-radius: 16px;
        padding: 20px;
        min-height: 300px;
        background: #fafafa;
      }

      .preview h1 {
        color: #4f46e5;
      }
      .preview h2 {
        color: #7c3aed;
      }
      .preview h3 {
        color: #db2777;
      }
      .preview h4 {
        color: #ea580c;
      }
      .preview h5 {
        color: #16a34a;
      }
      .preview h6 {
        color: #0f766e;
      }

      .preview .image-box {
        background: #dbeafe;
        border-radius: 14px;
        padding: 20px;
        text-align: center;
        font-size: 44px;
      }

      .preview ul,
      .preview ol {
        background: white;
        border-radius: 12px;
        padding: 16px 16px 16px 36px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
      }

      .preview a {
        display: inline-block;
        background: #4f46e5;
        color: white;
        text-decoration: none;
        padding: 10px 16px;
        border-radius: 999px;
        font-weight: bold;
      }

      .fact {
        margin-top: 16px;
        background: #fff7ed;
        border-left: 6px solid #f97316;
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 15px;
      }

      .quiz-question {
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 16px;
      }

      .quiz-answers {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.75);
        display: none;
        place-items: center;
        padding: 20px;
        z-index: 30;
      }

      .overlay.show {
        display: grid;
      }

      .card {
        background: white;
        border-radius: 24px;
        padding: 32px;
        max-width: 500px;
        text-align: center;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
      }

      .card h2 {
        margin: 0 0 10px;
        font-size: 30px;
      }

      .stars {
        font-size: 42px;
        margin: 12px 0;
      }

      .badge {
        display: inline-block;
        background: #fef3c7;
        border: 2px solid #f59e0b;
        padding: 8px 14px;
        border-radius: 999px;
        font-weight: bold;
        margin: 6px;
      }

      @media (max-width: 850px) {
        .container {
          padding: 0 12px;
        }
        .panel {
          padding: 16px;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>🦸 HTML Kahramanı 2</h1>
      <p>Etiketleri öğren, sayfa kur ve rozet topla!</p>
    </header>

    <div class="container">
      <div class="menu">
        <button class="mode-btn active" data-mode="match" style="color: black">
          <strong>🧩 Eşleştirme</strong>
          Açılış ve kapanış etiketlerini eşleştir.
        </button>

        <button class="mode-btn" data-mode="quiz" style="color: black">
          <strong>❓ Bu hangi etiket?</strong>
          Sayfayı incele ve doğru etiketi seç.
        </button>

        <button class="mode-btn" data-mode="build" style="color: black">
          <strong>🏗️ Sayfa Kur</strong>
          Etiketleri doğru sırayla tıklayarak sayfa oluştur.
        </button>

        <button class="mode-btn" data-mode="challenge" style="color: black">
          <strong>⚡ Meydan Okuma</strong>
          Hızlı cevap ver ve puan topla.
        </button>
      </div>

      <div class="difficulty">
        <button class="diff-btn active" data-diff="easy">🙂 Kolay</button>
        <button class="diff-btn" data-diff="medium">😎 Orta</button>
        <button class="diff-btn" data-diff="hard">🔥 Zor</button>
      </div>

      <section class="panel">
        <div class="topbar">
          <span class="chip">🎮 <span id="modeName">Eşleştirme</span></span>
          <span class="chip">⭐ <span id="score">0</span></span>
          <span class="chip">🔥 Seri: <span id="streak">0</span></span>
          <span class="chip">🏅 <span id="badgeCount">0</span></span>
          <span class="chip">⏱️ <span id="timer">--</span></span>
        </div>

        <div class="progress">
          <div class="progress-fill" id="progressFill"></div>
        </div>

        <div id="gameArea"></div>
        <div class="message" id="message"></div>

        <div class="buttons">
          <button id="hintBtn">💡 İpucu</button>
          <button class="secondary" id="restartBtn">🔄 Yeni Oyun</button>
        </div>
      </section>

      <section class="panel">
        <h2>👀 Sayfa Önizlemesi</h2>
        <div class="preview" id="preview"></div>
        <div class="fact" id="fact"></div>
      </section>
    </div>

    <div class="overlay" id="overlay">
      <div class="card">
        <h2 id="overlayTitle">🎉 Bravo!</h2>
        <div class="stars" id="overlayStars">⭐⭐⭐</div>
        <p id="overlayText"></p>
        <div id="overlayBadge"></div>
        <br />
        <button id="nextBtn">Sonraki Bölüm ➡️</button>
      </div>
    </div>

    <script>
      const tagInfo = {
        h1: { tr: "Büyük başlık", icon: "🏷️" },
        h2: { tr: "Başlık 2", icon: "🏷️" },
        h3: { tr: "Başlık 3", icon: "🏷️" },
        h4: { tr: "Başlık 4", icon: "🏷️" },
        h5: { tr: "Başlık 5", icon: "🏷️" },
        h6: { tr: "Küçük başlık", icon: "🏷️" },
        p: { tr: "Paragraf", icon: "📝" },
        strong: { tr: "Çok önemli", icon: "💪" },
        em: { tr: "Vurgulu", icon: "✨" },
        i: { tr: "İtalik", icon: "🔤" },
        b: { tr: "Kalın", icon: "🅱️" },
        br: { tr: "Yeni satır", icon: "⏎" },
        img: { tr: "Görsel", icon: "🖼️" },
        a: { tr: "Bağlantı", icon: "🔗" },
        ul: { tr: "Madde listesi", icon: "📋" },
        ol: { tr: "Numaralı liste", icon: "🔢" },
        li: { tr: "Liste öğesi", icon: "•" },
      };

      const quizQuestions = [
        {
          text: "Hangi etiket yazıyı çok önemli ve kalın yapar?",
          render: () => `<p>Bu <strong>çok önemli</strong>.</p>`,
          correct: "strong",
          options: ["strong", "em", "i", "p"],
        },
        {
          text: "Hangi etiket yazıyı italik yapar?",
          render: () => `<p>Bu <i>italik yazı</i>.</p>`,
          correct: "i",
          options: ["b", "i", "strong", "ul"],
        },
        {
          text: "Hangi etiket yeni satıra geçer?",
          render: () => `<p>İlk satır.<br>İkinci satır.</p>`,
          correct: "br",
          options: ["br", "p", "img", "a"],
        },
        {
          text: "Hangi etiket görsel eklemek için kullanılır?",
          render: () => `<div class="image-box">🖼️</div>`,
          correct: "img",
          options: ["img", "a", "ul", "h1"],
        },
        {
          text: "Hangi etiket bağlantı oluşturur?",
          render: () => `<p><a href="#">Beni Tıkla</a></p>`,
          correct: "a",
          options: ["a", "img", "li", "em"],
        },
        {
          text: "Hangi etiket madde işaretli liste oluşturur?",
          render: () => `<ul><li>Elma</li><li>Muz</li></ul>`,
          correct: "ul",
          options: ["ul", "ol", "li", "p"],
        },
        {
          text: "Hangi etiket numaralı liste oluşturur?",
          render: () => `<ol><li>Birinci</li><li>İkinci</li></ol>`,
          correct: "ol",
          options: ["ol", "ul", "br", "h2"],
        },
        {
          text: "Hangi etiket en büyük başlığı oluşturur?",
          render: () => `<h1>Büyük Başlık</h1>`,
          correct: "h1",
          options: ["h1", "h6", "p", "strong"],
        },
        {
          text: "Hangi etiket en küçük başlığı oluşturur?",
          render: () => `<h6>Küçük Başlık</h6>`,
          correct: "h6",
          options: ["h6", "h1", "h3", "b"],
        },
        {
          text: "Hangi etiket paragraf oluşturur?",
          render: () => `<p>Bu bir paragraf.</p>`,
          correct: "p",
          options: ["p", "div", "li", "a"],
        },
      ];

      const buildLevels = [
        {
          name: "Başlık ve Paragraf",
          sequence: [
            "<h1>",
            "Benim Sayfam",
            "</h1>",
            "<p>",
            "Ben HTML öğreniyorum.",
            "</p>",
          ],
        },
        {
          name: "Önemli ve Vurgulu",
          sequence: [
            "<p>",
            "HTML ",
            "<strong>",
            "çok önemli",
            "</strong>",
            " ve ",
            "<em>",
            "eğlenceli",
            "</em>",
            ".",
            "</p>",
          ],
        },
        {
          name: "Madde Listesi",
          sequence: [
            "<ul>",
            "<li>",
            "Elma",
            "</li>",
            "<li>",
            "Muz",
            "</li>",
            "</ul>",
          ],
        },
        {
          name: "Numaralı Liste",
          sequence: [
            "<ol>",
            "<li>",
            "Birinci",
            "</li>",
            "<li>",
            "İkinci",
            "</li>",
            "</ol>",
          ],
        },
        {
          name: "Görsel ve Bağlantı",
          sequence: ["<img>", "<br>", "<a>", "Beni Tıkla", "</a>"],
        },
      ];

      const matchLevels = {
        easy: [
          ["h1", "p", "strong"],
          ["ul", "li", "b"],
          ["a", "em", "h2"],
        ],
        medium: [
          ["h3", "ol", "li", "i"],
          ["strong", "em", "br", "img"],
          ["h4", "p", "a", "ul"],
        ],
        hard: [
          ["h5", "h6", "b", "i", "br"],
          ["ol", "ul", "li", "strong", "em"],
          ["h1", "h2", "h3", "a", "img", "p"],
        ],
      };

      let currentMode = "match";
      let currentDifficulty = "easy";
      let levelIndex = 0;
      let totalScore = 0;
      let streak = 0;
      let badges = 0;
      let completed = 0;
      let selectedTag = null;
      let hintsUsed = 0;
      let timer = null;
      let timeLeft = 0;
      let currentQuiz = null;
      let buildProgress = 0;

      const gameArea = document.getElementById("gameArea");
      const preview = document.getElementById("preview");
      const message = document.getElementById("message");
      const scoreEl = document.getElementById("score");
      const streakEl = document.getElementById("streak");
      const badgeCount = document.getElementById("badgeCount");
      const timerEl = document.getElementById("timer");
      const modeName = document.getElementById("modeName");
      const progressFill = document.getElementById("progressFill");
      const factBox = document.getElementById("fact");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayStars = document.getElementById("overlayStars");
      const overlayText = document.getElementById("overlayText");
      const overlayBadge = document.getElementById("overlayBadge");
      const nextBtn = document.getElementById("nextBtn");

      function playTone(frequency, duration = 0.18, type = "sine") {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = type;
          osc.frequency.value = frequency;
          osc.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            0.001,
            ctx.currentTime + duration,
          );

          osc.start();
          osc.stop(ctx.currentTime + duration);
        } catch (error) {}
      }

      function playCorrect() {
        playTone(660, 0.15);
        setTimeout(() => playTone(880, 0.18), 130);
      }

      function playWrong() {
        playTone(180, 0.25, "triangle");
      }

      function playLevelUp() {
        [523, 659, 784, 1046].forEach((frequency, index) => {
          setTimeout(() => playTone(frequency, 0.18), index * 120);
        });
      }

      function shuffle(items) {
        return [...items].sort(() => Math.random() - 0.5);
      }

      function setMode(mode) {
        currentMode = mode;
        stopTimer();
        levelIndex = 0;
        completed = 0;
        streak = 0;
        streakEl.textContent = 0;
        progressFill.style.width = "0%";
        preview.innerHTML = "";
        message.textContent = "";
        factBox.innerHTML = "";

        document.querySelectorAll(".mode-btn").forEach((button) => {
          button.classList.toggle("active", button.dataset.mode === mode);
        });

        modeName.textContent = {
          match: "Eşleştirme",
          quiz: "Bu hangi etiket?",
          build: "Sayfa Kur",
          challenge: "Meydan Okuma",
        }[mode];

        startCurrentMode();
      }

      function setDifficulty(difficulty) {
        currentDifficulty = difficulty;

        document.querySelectorAll(".diff-btn").forEach((button) => {
          button.classList.toggle("active", button.dataset.diff === difficulty);
        });

        startCurrentMode();
      }

      function startCurrentMode() {
        stopTimer();
        completed = 0;
        hintsUsed = 0;
        selectedTag = null;
        preview.innerHTML = "";
        message.textContent = "";
        factBox.innerHTML = "";
        progressFill.style.width = "0%";

        if (currentMode === "match") startMatchGame();
        if (currentMode === "quiz") startQuiz();
        if (currentMode === "build") startBuildGame();
        if (currentMode === "challenge") startChallenge();
      }

      function startMatchGame() {
        const levels = matchLevels[currentDifficulty];
        const tags = levels[levelIndex % levels.length];

        gameArea.innerHTML = `
    <h2>🧩 Etiketleri Eşleştir</h2>
    <div class="tags" id="tags"></div>
  `;

        const tagsArea = document.getElementById("tags");
        const items = [];

        tags.forEach((tag, index) => {
          items.push({ tag, kind: "open", pairId: index });
          items.push({ tag, kind: "close", pairId: index });
        });

        shuffle(items).forEach((item) => {
          const el = document.createElement("div");
          const isSingle = ["br", "img"].includes(item.tag);

          el.className =
            "tag " +
            (isSingle
              ? "single"
              : item.kind === "open"
                ? "opening"
                : "closing");

          el.innerHTML = `
      ${item.kind === "open" ? `<${item.tag}>` : `</${item.tag}>`}
      <small>${tagInfo[item.tag].icon} ${tagInfo[item.tag].tr}</small>
    `;

          el.dataset.pairId = item.pairId;
          el.dataset.kind = item.kind;
          el.dataset.tag = item.tag;
          el.draggable = true;

          el.addEventListener("dragstart", () => {
            if (!el.classList.contains("correct")) selectTag(el);
          });

          el.addEventListener("dragover", (event) => event.preventDefault());

          el.addEventListener("drop", (event) => {
            event.preventDefault();
            checkMatch(el);
          });

          el.addEventListener("click", () => {
            if (el.classList.contains("correct")) return;

            if (!selectedTag) selectTag(el);
            else checkMatch(el);
          });

          tagsArea.appendChild(el);
        });

        factBox.innerHTML = `
    💡 Normal bir HTML etiketinin başlangıcı ve bitişi vardır:
    <code>&lt;p&gt;</code> ve <code>&lt;/p&gt;</code>.
    Ancak <code>&lt;br&gt;</code> ve <code>&lt;img&gt;</code> tek başına kullanılan etiketlerdir.
  `;
      }

      function selectTag(el) {
        clearSelection();
        selectedTag = el;
        el.classList.add("selected");
      }

      function clearSelection() {
        document.querySelectorAll(".tag.selected").forEach((el) => {
          el.classList.remove("selected");
        });
        selectedTag = null;
      }

      function checkMatch(target) {
        if (!selectedTag || selectedTag === target) return;

        const samePair = selectedTag.dataset.pairId === target.dataset.pairId;
        const oppositeKind = selectedTag.dataset.kind !== target.dataset.kind;

        if (samePair && oppositeKind) {
          selectedTag.classList.remove("selected");
          selectedTag.classList.add("correct");
          target.classList.add("correct");

          selectedTag.draggable = false;
          target.draggable = false;

          addScore(hintsUsed > 0 ? 5 : 10);
          completed++;
          hintsUsed = 0;

          message.textContent = "✅ Harika! Etiketler doğru eşleşti.";
          message.style.color = "#15803d";
          playCorrect();

          selectedTag = null;
          updateMatchProgress();

          const tags =
            matchLevels[currentDifficulty][
              levelIndex % matchLevels[currentDifficulty].length
            ];

          if (completed === tags.length) {
            setTimeout(() => completeRound("Eşleştirme"), 700);
          }
        } else {
          target.classList.add("wrong");
          streak = 0;
          streakEl.textContent = 0;

          message.textContent = "🤔 Bu etiketler eşleşmiyor. Tekrar dene!";
          message.style.color = "#be123c";
          playWrong();

          setTimeout(() => target.classList.remove("wrong"), 400);
          clearSelection();
        }
      }

      function updateMatchProgress() {
        const tags =
          matchLevels[currentDifficulty][
            levelIndex % matchLevels[currentDifficulty].length
          ];
        progressFill.style.width = (completed / tags.length) * 100 + "%";
      }

      function startQuiz() {
        currentQuiz =
          quizQuestions[Math.floor(Math.random() * quizQuestions.length)];

        gameArea.innerHTML = `
    <h2>❓ Bu hangi etiket?</h2>
    <div class="quiz-question">${currentQuiz.text}</div>
    <div class="preview" id="quizPreview">${currentQuiz.render()}</div>
    <br>
    <div class="quiz-answers" id="quizAnswers"></div>
  `;

        const answersArea = document.getElementById("quizAnswers");
        const options = shuffle(currentQuiz.options);

        options.forEach((option) => {
          const button = document.createElement("button");
          button.className = "tag answer";
          button.innerHTML = `
      &lt;${option}&gt;
      <small>${tagInfo[option].icon} ${tagInfo[option].tr}</small>
    `;

          button.addEventListener("click", () =>
            checkQuizAnswer(option, button),
          );
          answersArea.appendChild(button);
        });

        factBox.innerHTML =
          "💡 Yukarıdaki örneği incele ve o efekti yapan etiketi seç.";
      }

      function checkQuizAnswer(answer, button) {
        if (answer === currentQuiz.correct) {
          button.classList.add("correct");
          addScore(10);
          message.textContent = "✅ Doğru! Bu <" + answer + "> etiketi.";
          message.style.color = "#15803d";
          playCorrect();

          setTimeout(startQuiz, 1100);
        } else {
          button.classList.add("wrong");
          streak = 0;
          streakEl.textContent = 0;
          message.textContent = "❌ Bu değil. Örneği tekrar incele!";
          message.style.color = "#be123c";
          playWrong();

          setTimeout(() => button.classList.remove("wrong"), 400);
        }
      }

      function startBuildGame() {
        const level = buildLevels[levelIndex % buildLevels.length];
        buildProgress = 0;

        gameArea.innerHTML = `
    <h2>🏗️ Kur: ${level.name}</h2>
    <p>Parçaları doğru sırayla tıkla.</p>
    <div class="tags" id="buildTags"></div>
  `;

        const area = document.getElementById("buildTags");

        shuffle(
          level.sequence.map((token, index) => ({ token, index })),
        ).forEach((item) => {
          const el = document.createElement("div");
          const isTag = item.token.startsWith("<");

          el.className = "tag " + (isTag ? "opening" : "answer");
          el.textContent = item.token;
          el.dataset.index = item.index;

          el.addEventListener("click", () => checkBuildAnswer(item.index, el));
          area.appendChild(el);
        });

        factBox.innerHTML =
          "💡 HTML yukarıdan aşağıya okunur. Önce etiket açılır, sonra içerik yazılır, en sonda etiket kapatılır.";
      }

      function checkBuildAnswer(index, el) {
        const level = buildLevels[levelIndex % buildLevels.length];

        if (index === buildProgress) {
          el.classList.add("correct");
          buildProgress++;

          addScore(10);
          preview.innerHTML += renderBuildToken(
            level.sequence[buildProgress - 1],
          );

          message.textContent = "✅ Doğru! Devam et.";
          message.style.color = "#15803d";
          playCorrect();

          progressFill.style.width =
            (buildProgress / level.sequence.length) * 100 + "%";

          if (buildProgress === level.sequence.length) {
            setTimeout(() => completeRound("Sayfa Kurma"), 700);
          }
        } else {
          el.classList.add("wrong");
          streak = 0;
          streakEl.textContent = 0;
          message.textContent =
            "❌ Bu sıradaki parça değil. Başka bir tane dene!";
          message.style.color = "#be123c";
          playWrong();

          setTimeout(() => el.classList.remove("wrong"), 400);
        }
      }

      function renderBuildToken(token) {
        if (token === "<h1>") return "<h1>";
        if (token === "</h1>") return "Benim Sayfam</h1>";
        if (token === "<p>") return "<p>";
        if (token === "</p>") return "Ben HTML öğreniyorum.</p>";
        if (token === "<strong>") return "<strong>";
        if (token === "</strong>") return "çok önemli</strong>";
        if (token === "<em>") return "<em>";
        if (token === "</em>") return "eğlenceli</em>";
        if (token === "<ul>") return "<ul>";
        if (token === "</ul>") return "</ul>";
        if (token === "<ol>") return "<ol>";
        if (token === "</ol>") return "</ol>";
        if (token === "<li>") return "<li>";
        if (token === "</li>") return "Liste öğesi</li>";
        if (token === "<img>") return `<div class="image-box">🖼️</div>`;
        if (token === "<br>") return "<br>";
        if (token === "<a>") return "<a href='#'>";
        if (token === "</a>") return "Beni Tıkla</a>";

        return "";
      }

      function startChallenge() {
        timeLeft =
          currentDifficulty === "easy"
            ? 30
            : currentDifficulty === "medium"
              ? 20
              : 15;

        timerEl.textContent = timeLeft + " saniye";
        startQuiz();

        timer = setInterval(() => {
          timeLeft--;
          timerEl.textContent = timeLeft + " saniye";

          if (timeLeft <= 0) {
            stopTimer();
            message.textContent = "⏰ Süre bitti! Tekrar dene.";
            message.style.color = "#be123c";
            playWrong();
          }
        }, 1000);
      }

      function stopTimer() {
        if (timer) {
          clearInterval(timer);
          timer = null;
        }
        timerEl.textContent = "--";
      }

      function addScore(points) {
        streak++;
        streakEl.textContent = streak;

        let bonus = 0;
        if (streak >= 3) bonus = 5;
        if (streak >= 5) bonus = 10;

        totalScore += points + bonus;
        scoreEl.textContent = totalScore;

        if (bonus > 0) {
          message.textContent += ` 🔥 Bonus: +${bonus}`;
        }
      }

      function completeRound(modeNameText) {
        const stars = hintsUsed === 0 ? 3 : hintsUsed <= 2 ? 2 : 1;

        overlayTitle.textContent = "🎉 Bravo!";
        overlayStars.textContent = "⭐".repeat(stars) + "☆".repeat(3 - stars);
        overlayText.textContent = `Bölümü tamamladın: ${modeNameText}.`;

        if (stars === 3) {
          badges++;
          badgeCount.textContent = badges;
          overlayBadge.innerHTML = `<span class="badge">🏅 ${modeNameText} Uzmanı</span>`;
        } else {
          overlayBadge.innerHTML = "";
        }

        overlay.classList.add("show");
        playLevelUp();

        nextBtn.textContent = "Sonraki Bölüm ➡️";
      }

      function nextRound() {
        overlay.classList.remove("show");
        levelIndex++;
        startCurrentMode();
      }

      function giveHint() {
        if (currentMode === "match") {
          const openTags = [
            ...document.querySelectorAll(".tag.opening:not(.correct)"),
          ];
          const closeTags = [
            ...document.querySelectorAll(".tag.closing:not(.correct)"),
          ];

          if (!openTags.length || !closeTags.length) return;

          const openTag = openTags[0];
          const closeTag = closeTags.find(
            (tag) => tag.dataset.pairId === openTag.dataset.pairId,
          );

          if (!closeTag) return;

          openTag.classList.add("correct");
          closeTag.classList.add("correct");
          openTag.draggable = false;
          closeTag.draggable = false;

          hintsUsed++;
          addScore(5);
          completed++;
          updateMatchProgress();

          message.textContent = "💡 İpucu: Bu iki etiket birbirine bağlı.";
          message.style.color = "#b45309";
          playCorrect();

          const tags =
            matchLevels[currentDifficulty][
              levelIndex % matchLevels[currentDifficulty].length
            ];

          if (completed === tags.length) {
            setTimeout(() => completeRound("Eşleştirme"), 700);
          }
        }

        if (currentMode === "quiz") {
          message.textContent = `💡 Hatırlatma: Doğru etiket <${currentQuiz.correct}>.`;
          message.style.color = "#b45309";
        }

        if (currentMode === "build") {
          const level = buildLevels[levelIndex % buildLevels.length];
          message.textContent = `💡 Sıradaki parça: ${level.sequence[buildProgress]}`;
          message.style.color = "#b45309";
        }
      }

      document.querySelectorAll(".mode-btn").forEach((button) => {
        button.addEventListener("click", () => setMode(button.dataset.mode));
      });

      document.querySelectorAll(".diff-btn").forEach((button) => {
        button.addEventListener("click", () =>
          setDifficulty(button.dataset.diff),
        );
      });

      document.getElementById("hintBtn").addEventListener("click", giveHint);
      document
        .getElementById("restartBtn")
        .addEventListener("click", startCurrentMode);
      nextBtn.addEventListener("click", nextRound);

      setMode("match");
    </script>
  </body>
</html>
